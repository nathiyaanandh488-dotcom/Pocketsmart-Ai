{% extends "base.html" %}
{% block title %}Create account - PocketSmart AI{% endblock %}
{% block content %}
<div class="wrap">
  <div class="page-head"><h1>Create your account</h1></div>
  <form class="form-card narrow" method="post" action="/register">
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="{{ form.username if form else '' }}" autocomplete="username" required minlength="3" maxlength="30">
      <p class="hint">Letters, numbers and underscores.</p>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ form.email if form else '' }}" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6">
    </div>
    <div class="field">
      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required minlength="6">
    </div>
    <button class="btn" type="submit">Create account</button>
    <p class="hint">Already registered? <a href="/login">Log in</a>.</p>
  </form>
</div>
{% endblock %}
